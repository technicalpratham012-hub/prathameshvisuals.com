<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prathamesh Garode — Visual Creator & Designer</title>
  
  <!-- Font Awesome 6.4.0 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts (Montserrat & Playfair Display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <style>
    /* === CSS VARIABLES === */
    :root {
      --bg-color: #000000;
      --bg-footer: #080808;
      --text-color: #ffffff;
      --text-muted: #a0a0a0;
      --accent-green: #39ff14;
      --accent-gold: #c9a84c;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --glow-green: rgba(57, 255, 20, 0.15);
      --glow-gold: rgba(201, 168, 76, 0.15);
      --font-sans: 'Montserrat', sans-serif;
      --font-serif: 'Playfair Display', serif;
      --transition-fast: 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      --transition-smooth: 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* === GLOBAL RESET === */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-color);
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) var(--bg-color);
    }

    [id] {
      scroll-margin-top: 100px;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      overflow-x: hidden;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle Technical Grid Overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: -2;
    }

    /* === SCROLLBAR === */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-color);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-green);
    }

    /* === TYPOGRAPHY & LAYOUT UTILITIES === */
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px;
    }

    h1, h2, h3, h4 {
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .accent-serif {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--accent-gold);
      font-weight: 400;
    }

    p {
      color: var(--text-muted);
      font-size: clamp(0.95rem, 1.1vw, 1.15rem);
    }

    /* Custom Cursor */
    .cursor-dot, .cursor-ring {
      display: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .cursor-dot {
        display: block;
        width: 8px;
        height: 8px;
        background-color: var(--accent-green);
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 10000;
        transform: translate(-50%, -50%);
        transition: width 0.3s, height 0.3s, background-color 0.3s;
      }
      .cursor-ring {
        display: block;
        width: 36px;
        height: 36px;
        border: 1.5px solid var(--accent-green);
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition: border-color 0.3s, width 0.3s, height 0.3s, background-color 0.3s;
      }
    }

    /* Floating Ambient Blobs */
    .glow-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.12;
      z-index: -1;
      pointer-events: none;
    }
    .blob-1 {
      width: 500px;
      height: 500px;
      background: var(--accent-green);
      top: -10%;
      right: -10%;
    }
    .blob-2 {
      width: 600px;
      height: 600px;
      background: var(--accent-gold);
      bottom: -10%;
      left: -10%;
    }

    /* === BUTTONS & BADGES === */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      border-radius: 50px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition-fast);
      cursor: pointer;
      min-height: 48px;
    }

    .btn-primary {
      background-color: var(--accent-green);
      color: #000000;
      box-shadow: 0 4px 20px var(--glow-green);
    }

    .btn-primary:hover {
      background-color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
    }

    .btn-outline {
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      background: transparent;
    }

    .btn-outline:hover {
      background: rgba(57, 255, 20, 0.05);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px var(--glow-green);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(57, 255, 20, 0.08);
      border: 1px solid rgba(57, 255, 20, 0.2);
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent-green);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      position: relative;
    }

    .pulse-dot::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--accent-green);
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    .section-tag {
      font-family: var(--font-sans);
      color: var(--accent-green);
      text-transform: uppercase;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      display: inline-block;
      margin-bottom: 16px;
    }

    .section-heading {
      font-size: clamp(2rem, 4vw, 3.5rem);
      margin-bottom: 50px;
      line-height: 1.1;
    }

    /* === REVEAL ANIMATIONS === */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1), transform 1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* === NAVBAR === */
    header {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1200px;
      z-index: 1000;
      transition: var(--transition-smooth);
    }

    .nav-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 12px 28px;
      border-radius: 100px;
      transition: var(--transition-smooth);
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 900;
      text-decoration: none;
      color: var(--text-color);
      letter-spacing: -0.02em;
    }

    .logo span {
      color: var(--accent-green);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: var(--transition-fast);
      position: relative;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--text-color);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -6px;
      left: 0;
      background-color: var(--accent-green);
      transition: var(--transition-fast);
    }

    .nav-links a:hover::after, .nav-links a.active::after {
      width: 100%;
    }

    .nav-btn {
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition-fast);
      background: linear-gradient(135deg, var(--accent-gold) 0%, #9e802f 100%);
      color: #000000;
      box-shadow: 0 4px 15px var(--glow-gold);
      min-height: auto;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(201, 168, 76, 0.4);
    }

    /* Scroll Navbar Style */
    header.scrolled {
      top: 12px;
      width: 95%;
    }

    header.scrolled .nav-pill {
      background: rgba(0, 0, 0, 0.85);
      border-color: rgba(57, 255, 20, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    /* Hamburger Menu */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      z-index: 1001;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background-color: var(--text-color);
      transition: var(--transition-smooth);
    }

    .hamburger.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    /* Fullscreen Mobile Overlay */
    .mobile-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 32px;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition-smooth);
    }

    .mobile-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .mobile-links a {
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.8rem;
      font-weight: 900;
      transition: var(--transition-fast);
    }

    .mobile-links a:hover {
      color: var(--accent-green);
    }

    .mobile-btn {
      margin-top: 10px;
    }

    /* === HERO SECTION === */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 160px 0 80px 0;
      position: relative;
    }

    .hero-container {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: center;
    }

    /* Hero Text Content Load States */
    .hero .fade-reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .hero .fade-reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-content h1 {
      font-size: clamp(2.8rem, 7.5vw, 5.5rem);
      line-height: 0.9;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }

    .hero-desc {
      font-size: clamp(1rem, 1.2vw, 1.3rem);
      max-width: 520px;
      margin-bottom: 32px;
    }

    .hero-socials {
      display: flex;
      gap: 16px;
      margin-bottom: 36px;
    }

    .social-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.02);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.1rem;
      transition: var(--transition-fast);
    }

    .social-btn:hover {
      transform: translateY(-3px);
      border-color: var(--accent-green);
      color: var(--accent-green);
      box-shadow: 0 6px 20px var(--glow-green);
    }

    .hero-ctas {
      display: flex;
      gap: 16px;
    }

    /* Hero Visual Box & Image Fallbacks */
    .hero-visual {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.1;
      border-radius: 30px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      background: linear-gradient(145deg, rgba(255,255,255,0.01) 0%, rgba(255,255,255,0.04) 100%);
    }

    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
      transition: var(--transition-smooth);
    }

    .hero-visual:hover .hero-img {
      transform: scale(1.05);
    }

    /* Redundant Visual Fallback behind missing img */
    .image-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(57, 255, 20, 0.08) 0%, transparent 70%);
      z-index: 1;
      overflow: hidden;
    }

    .fallback-initials {
      font-size: 8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.2;
      letter-spacing: -0.05em;
    }

    .circle-orbit-1, .circle-orbit-2 {
      position: absolute;
      border: 1px dashed rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      pointer-events: none;
    }

    .circle-orbit-1 {
      width: 120%;
      height: 120%;
      animation: spin 80s linear infinite;
    }

    .circle-orbit-2 {
      width: 150%;
      height: 150%;
      animation: spin-reverse 100s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    /* Scroll Down Indicator */
    .scroll-down {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .mouse-icon {
      width: 24px;
      height: 40px;
      border: 2px solid var(--text-muted);
      border-radius: 20px;
      position: relative;
    }

    .scroll-wheel {
      width: 4px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 2px;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      animation: wheelScroll 1.6s infinite;
    }

    @keyframes wheelScroll {
      0% { opacity: 0; top: 8px; }
      50% { opacity: 1; }
      100% { opacity: 0; top: 18px; }
    }

    .scroll-text {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-muted);
    }

    /* === ABOUT PREVIEW === */
    .about {
      padding: 100px 0;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 60px;
      align-items: center;
    }

    .about-text h2 {
      margin-bottom: 24px;
    }

    .about-text p {
      margin-bottom: 20px;
    }

    .about-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 40px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      transition: var(--transition-smooth);
    }

    .stat-card:hover {
      border-color: var(--accent-green);
      box-shadow: 0 10px 25px var(--glow-green);
    }

    .stat-number-wrapper {
      font-size: clamp(1.8rem, 3.5vw, 2.5rem);
      font-weight: 900;
      color: var(--text-color);
      line-height: 1;
      margin-bottom: 8px;
    }

    .stat-number {
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat-plus {
      color: var(--accent-green);
    }

    .stat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    /* === SERVICES SECTION === */
    .services {
      padding: 100px 0;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }

    .service-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 30px;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 10% 10%, var(--glow-green) 0%, transparent 60%);
      opacity: 0;
      transition: var(--transition-smooth);
    }

    .service-card:hover::before {
      opacity: 1;
    }

    .service-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent-green);
      box-shadow: 0 15px 35px var(--glow-green);
    }

    .service-icon {
      font-size: 2.5rem;
      margin-bottom: 24px;
      position: relative;
      z-index: 2;
    }

    .service-title {
      font-size: 1.3rem;
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .service-desc {
      position: relative;
      z-index: 2;
    }

    /* === PORTFOLIO SECTION === */
    .portfolio {
      padding: 100px 0;
    }

    .portfolio-filters {
      display: flex;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 24px;
      border-radius: 50px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #000000;
      box-shadow: 0 4px 15px var(--glow-green);
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .portfolio-item {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.01);
      aspect-ratio: 16/10;
      transition: var(--transition-smooth);
    }

    .portfolio-img-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .portfolio-fallback-bg {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
    }

    .portfolio-fallback-bg span {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--text-color);
      opacity: 0.7;
    }

    .portfolio-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px;
      opacity: 0;
      transition: var(--transition-smooth);
    }

    .portfolio-item:hover .portfolio-overlay {
      opacity: 1;
    }

    .portfolio-item:hover {
      transform: scale(1.02);
      border-color: var(--accent-green);
      box-shadow: 0 15px 35px var(--glow-green);
    }

    .portfolio-category {
      color: var(--accent-green);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .portfolio-title {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .portfolio-desc {
      font-size: 0.9rem;
      max-width: 80%;
    }

    .portfolio-link {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--accent-green);
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      text-decoration: none;
      transition: var(--transition-smooth);
      transform: translateY(-20px);
    }

    .portfolio-item:hover .portfolio-link {
      transform: translateY(0);
    }

    .portfolio-link:hover {
      background: #ffffff;
      transform: scale(1.1);
    }

    /* === CONTACT SECTION === */
    .contact {
      padding: 100px 0;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 60px;
    }

    .contact-sub {
      margin-bottom: 40px;
    }

    .info-items {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }

    .info-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--accent-green);
    }

    .info-detail span {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .info-detail a, .info-detail p {
      color: var(--text-color);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .info-detail a:hover {
      color: var(--accent-green);
    }

    .contact-form {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .form-group input, .form-group textarea {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--card-border);
      padding: 14px 18px;
      border-radius: 12px;
      color: var(--text-color);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      transition: var(--transition-fast);
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent-green);
      box-shadow: 0 0 15px var(--glow-green);
    }

    .btn-submit {
      width: 100%;
    }

    .form-feedback {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      font-size: 0.9rem;
      text-align: center;
    }

    .form-feedback.success {
      background: rgba(57, 255, 20, 0.1);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
    }

    /* === READ MORE / ABOUT MODAL === */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .modal-content {
      position: relative;
      background: #080808;
      border: 1px solid var(--card-border);
      width: 90%;
      max-width: 850px;
      max-height: 85vh;
      border-radius: 24px;
      padding: 50px;
      overflow-y: auto;
      z-index: 2001;
      transform: scale(0.9);
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 50px rgba(57, 255, 20, 0.05);
    }

    .modal.active .modal-content {
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: var(--transition-fast);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .modal-close:hover {
      color: var(--text-color);
      background: rgba(255,255,255,0.05);
    }

    .modal-title {
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      margin-bottom: 30px;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 40px;
    }

    .modal-text p {
      margin-bottom: 20px;
    }

    .modal-text h3 {
      font-size: 1.25rem;
      margin: 30px 0 15px 0;
      color: var(--accent-green);
    }

    .modal-timeline {
      border-left: 1px solid var(--card-border);
      padding-left: 24px;
    }

    .timeline-title {
      font-size: 1.2rem;
      margin-bottom: 24px;
    }

    .timeline-step {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .step-num {
      font-weight: 900;
      color: var(--accent-gold);
    }

    .timeline-step h4 {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .timeline-step p {
      font-size: 0.85rem;
    }

    /* === FOOTER === */
    .site-footer {
      background-color: var(--bg-footer);
      border-top: 1px solid rgba(57, 255, 20, 0.1);
      padding: 80px 0 40px 0;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr 1fr;
      gap: 60px;
      margin-bottom: 60px;
    }

    .footer-logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      display: inline-block;
    }

    .footer-tagline {
      margin-bottom: 24px;
      max-width: 320px;
    }

    .footer-socials {
      display: flex;
      gap: 12px;
    }

    .footer-nav h4, .footer-contact h4 {
      font-size: 1.1rem;
      margin-bottom: 24px;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .footer-nav ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .footer-nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition-fast);
    }

    .footer-nav a:hover {
      color: var(--text-color);
      padding-left: 4px;
    }

    .footer-contact p {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .footer-contact a {
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition-fast);
    }

    .footer-contact a:hover {
      color: var(--accent-green);
    }

    .footer-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 30px;
    }

    .footer-bottom-flex {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* === RESPONSIVE LAYOUTS === */
    @media (max-width: 991px) {
      .hero-container {
        grid-template-columns: 1fr;
        gap: 50px;
      }

      .hero-visual {
        order: -1;
        max-width: 380px;
        margin: 0 auto;
      }

      .hero-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .hero-ctas {
        justify-content: center;
      }

      .about-grid {
        grid-template-columns: 1fr;
        gap: 50px;
      }

      .services-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .portfolio-grid {
        grid-template-columns: 1fr;
      }

      .contact-grid {
        grid-template-columns: 1fr;
        gap: 50px;
      }

      .modal-grid {
        grid-template-columns: 1fr;
      }

      .modal-timeline {
        border-left: none;
        border-top: 1px solid var(--card-border);
        padding-left: 0;
        padding-top: 30px;
      }
    }

    @media (max-width: 768px) {
      header {
        top: 14px;
      }

      .nav-links, .nav-btn-wrapper {
        display: none;
      }

      .hamburger {
        display: flex;
      }
